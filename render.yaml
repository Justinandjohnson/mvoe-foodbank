previews:
  generation: off

services:
  - type: web
    name: mvoe-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci && npm run prisma:generate
    preDeployCommand: npx prisma db push && npm run prisma:generate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mvoe-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mvoe-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: LOG_LEVEL
        value: info

  - type: web
    name: mvoe-agent-api
    runtime: python
    rootDir: python_backend
    plan: starter
    buildCommand: uv sync --frozen && uv cache prune --ci
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: UV_VERSION
        value: "0.5"
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://mvoe-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: mvoe-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: mvoe-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: EXPO_PUBLIC_AGENT_API_URL
        sync: false
      - key: EXPO_PUBLIC_WS_URL
        sync: false
      - key: EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN
        sync: false
      - key: EXPO_PUBLIC_APP_ENV
        value: production

  - type: keyvalue
    name: mvoe-redis
    plan: free
    ipAllowList: []

databases:
  - name: mvoe-postgres
    plan: free
